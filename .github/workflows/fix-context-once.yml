name: Fix context compile error once

on:
  push:
    branches: [fix/crm-data-ux-2026-09-28]
    paths: ['.github/workflows/fix-context-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/crm-data-ux-2026-09-28
      - name: Patch context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/context/LiveCrmContext.tsx')
          s = p.read_text()
          old = "JSON.stringify({contactId,text:content})"
          new = "JSON.stringify({contactId:clientId,text:content})"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit
        run: |
          git config user.name 'Satori CRM Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/context/LiveCrmContext.tsx
          git commit -m 'Fix Telegram contact id in context'
          git push origin HEAD:fix/crm-data-ux-2026-09-28
